trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/dev/*
      - modules/*
      - azure-pipelines.yml

# Pipeline run karte waqt environment parameters
parameters:
  - name: environment
    displayName: 'Select Environment'
    type: string
    default: 'dev'
    allowed:
      - dev

pool:
  name: agentvikrant

# Dev environment ke specific variables
variables:
  terraformWorkingDirectory: '$(Build.SourcesDirectory)/environments/dev'
  backendStorageAccount: 'backendstoragedevvik'  # Apne Dev Storage Account ka naam yahan badlein
  backendKey: 'terraform-dev.tfstate'

stages:
# ============================================================
# 1. TERRAFORM SECURITY SCAN
# ============================================================
- stage: TerraformSecurityScan
  displayName: 'Dev - Terraform Security Scan'
  jobs:
  - job: tfsec
    displayName: 'Run TFSEC'
    steps:
    - checkout: self
      clean: true

    - task: tfsec@1
      displayName: 'Terraform Security Scan'
      continueOnError: true
      inputs:
        version: 'v1.26.0'

# ============================================================
# 2. TFLINT (parallel)
# ============================================================
- stage: TerraformTFLint
  displayName: 'Dev - TFlint'
  jobs:
  - job: TFLint
    displayName: 'Run TFLint'
    steps:
    - checkout: self
      clean: true
    - powershell: |
        $ErrorActionPreference = "Continue"
        $tflint = "C:\Terraform\tflint.exe"
        if (Test-Path $tflint) {
          Set-Location "$(Build.SourcesDirectory)"
          & $tflint --init
          & $tflint --recursive
        } else {
          Write-Warning "TFLint binary not found. Skipping check."
        }
      displayName: 'Run TFLint Analyzer'

# ============================================================
# 3. CHECKOV
# ============================================================
- stage: TerraformCheckov
  displayName: 'Dev - Checkov'
  jobs:
  - job: checkov
    displayName: 'Run Checkov'
    steps:
    - checkout: self
      clean: true
   
    - task: PublishTestResults@2
      displayName: 'Publish Checkov Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/checkov/**/*.xml'
        testRunTitle: 'Checkov Dev Terraform Scan'
        failTaskOnFailedTests: false

# ============================================================
# 4. TRIVY
# ============================================================
- stage: TerraformTrivy
  displayName: 'Dev - Trivy'
  dependsOn: []
  jobs:
  - job: trivy
    displayName: 'Run Trivy Config Scan'
    steps:
    - checkout: self
      clean: true
      displayName: 'Run Trivy'

    - powershell: |
        Write-Host "Sources dir : $(Build.SourcesDirectory)"
        Write-Host "Work dir    : $(terraformWorkingDirectory)"
        Write-Host "Work dir exists? " (Test-Path "$(terraformWorkingDirectory)")
        Write-Host "terraform.exe exists? " (Test-Path "C:\Terraform\terraform.exe")
        Write-Host "--- .tf files in repo ---"
        Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter *.tf |
          Select-Object -First 30 -ExpandProperty FullName
      displayName: 'DEBUG paths'
      
# ============================================================
# 5. TERRAFORM INIT + VALIDATE + PLAN
# ============================================================
- stage: TerraformPlan
  displayName: 'Dev - Init Validate Plan'
  dependsOn: TerraformSecurityScan

  jobs:
  - job: terraform_plan
    displayName: 'Terraform Init Validate Plan'

   steps:
    - checkout: self
      clean: true

    # -------------------------
    # Terraform Init
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init (Dev)'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: 'vikrantsc1'
        backendAzureRmResourceGroupName: 'RG-Vikrant'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: 'backendcontainer'
        backendAzureRmKey: '$(backendKey)'

    # -------------------------
    # Terraform Validate
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    # -------------------------
    # Terraform Plan
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: 'vikrantsc1'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    # -------------------------
    # Publish Terraform Plan
    # -------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Dev Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan-dev'

# ============================================================
# 6. MANUAL APPROVAL
# ============================================================
- stage: ManualApproval
  displayName: 'Dev - Manual Approval'
  dependsOn: TerraformPlan

  jobs:
  - job: approval
    displayName: 'Approve Dev Apply'
    pool: server
    timeoutInMinutes: 1440

    steps:
    - task: ManualValidation@1
      displayName: 'Approve Dev Apply'
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: 'YOUR_EMAIL@example.com'
        instructions: |
          Dev Terraform Plan review karein aur pipeline aage badhane ke liye Approve karein.
        onTimeout: 'reject'

# ============================================================
# 7. TERRAFORM APPLY
# ============================================================
- stage: TerraformApply
  displayName: 'Dev - Terraform Apply'
  dependsOn: ManualApproval

  jobs:
  - job: terraform_apply
    displayName: 'Terraform Apply'

    steps:
    - checkout: self
      clean: true

    # -------------------------
    # Download Approved Plan
    # -------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Dev Plan'
      inputs:
        artifact: 'terraform-plan-dev'
        path: '$(Pipeline.Workspace)/terraform-plan'

    # -------------------------
    # Terraform Init
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init (Dev)'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: 'vikrantsc1'
        backendAzureRmResourceGroupName: 'RG-Vikrant'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: 'backendcontainer'
        backendAzureRmKey: '$(backendKey)'

    # -------------------------
    # Terraform Apply
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Apply Approved Dev Plan'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: 'vikrantsc1'
        commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'
