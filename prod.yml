trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/prod/*
      - modules/*
      - azure-pipelines.yml

pool:
  name: agentvikrant

variables:
  terraformWorkingDirectory: '$(Build.SourcesDirectory)/environments/preprod'

stages:
# ============================================================
# 1. TERRAFORM SECURITY SCAN
# ============================================================
- stage: TerraformSecurityScan
  displayName: 'Terraform Security Scan'

  jobs:
  - job: tfsec
    displayName: 'Run TFSEC'

    steps:
    - checkout: self
      clean: true

    - task: tfsec@1
      displayName: 'Terraform Security Scan'
      continueOnError: true
      inputs:
        version: 'v1.26.0'

# ============================================================
# STAGE 2: TFLINT (parallel)
# ============================================================
- stage: TerraformTFLint
  displayName: 'TFlint'
  jobs:
  - job: TFLint
    displayName: 'Run TFLint'
    steps:
    - checkout: self
      clean: true
    - powershell: |
        $ErrorActionPreference = "Continue"
        $tflint = "C:\Terraform\tflint.exe"
        if (Test-Path $tflint) {
          Set-Location "$(Build.SourcesDirectory)"
          & $tflint --init
          & $tflint --recursive
        } else {
          Write-Warning "TFLint binary not found. Skipping check."
        }
      displayName: 'Run TFLint Analyzer'

# ============================================================
# 2. TERRAFORM INIT + VALIDATE + PLAN
# ============================================================
    - powershell: |
        Write-Host "Sources dir : $(Build.SourcesDirectory)"
        Write-Host "Work dir    : $(terraformWorkingDirectory)"
        Write-Host "Work dir exists? " (Test-Path "$(terraformWorkingDirectory)")
        Write-Host "terraform.exe exists? " (Test-Path "C:\Terraform\terraform.exe")
        Write-Host "--- .tf files in repo ---"
        Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter *.tf |
          Select-Object -First 30 -ExpandProperty FullName
      displayName: 'DEBUG paths'
      
- stage: TerraformPlan
  displayName: 'Terraform Init Validate Plan'
  dependsOn: TerraformSecurityScan

  jobs:
  - job: terraform_plan
    displayName: 'Terraform Init Validate Plan'

    steps:
    - checkout: self
      clean: true

    # -------------------------
    # Terraform Init
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: 'vikrantsc1'
        backendAzureRmResourceGroupName: 'RG-Vikrant'
        backendAzureRmStorageAccountName: 'backendstoragevik'
        backendAzureRmContainerName: 'backendcontainer'
        backendAzureRmKey: 'terraform.tfstate'

    # -------------------------
    # Terraform Validate
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    # -------------------------
    # Terraform Plan
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: 'vikrantsc1'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    # -------------------------
    # Publish Terraform Plan
    # -------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan'

# ============================================================
# 3. MANUAL APPROVAL
# ============================================================
- stage: ManualApproval
  displayName: 'Manual Approval'
  dependsOn: TerraformPlan

  jobs:
  - job: approval
    displayName: 'Approve Terraform Apply'
    pool: server

    timeoutInMinutes: 1440

    steps:
    - task: ManualValidation@1
      displayName: 'Approve Terraform Apply'
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: 'YOUR_EMAIL@example.com'
        instructions: |
          Terraform Plan has completed successfully.

          Please review the Terraform Plan.

          If the changes are approved, click Resume
          to continue with Terraform Apply.
        onTimeout: 'reject'

# ============================================================
# 4. TERRAFORM APPLY
# ============================================================
- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: ManualApproval

  jobs:
  - job: terraform_apply
    displayName: 'Terraform Apply'

    steps:
    - checkout: self
      clean: true

    # -------------------------
    # Download Approved Plan
    # -------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Plan'
      inputs:
        artifact: 'terraform-plan'
        path: '$(Pipeline.Workspace)/terraform-plan'

    # -------------------------
    # Terraform Init
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: 'vikrantsc1'
        backendAzureRmResourceGroupName: 'RG-Vikrant'
        backendAzureRmStorageAccountName: 'backendstoragevik'
        backendAzureRmContainerName: 'backendcontainer'
        backendAzureRmKey: 'terraform.tfstate'

    # -------------------------
    # Terraform Apply
    # -------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Apply Approved Plan'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: 'vikrantsc1'
        commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'

